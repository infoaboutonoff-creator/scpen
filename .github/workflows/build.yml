name: Build ScreenPen APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write project files
        run: |
          mkdir -p ScreenPen && cd ScreenPen
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenPen"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.screenpen"
              compileSdk = 34

              signingConfigs {
                  create("rel") {
                      storeFile = file("../rel.jks")
                      storePassword = "android123"
                      keyAlias = "key0"
                      keyPassword = "android123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("rel")
                      isMinifyEnabled = false
                  }
              }

              defaultConfig {
                  applicationId = "com.abcstudy.screenpen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="स्क्रीन पेन"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="screen_annotation" />
                  </service>

              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/MainActivity.kt <<'EOF'
          package com.example.screenpen

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(40), dp(20), dp(20))
                  }

                  root.addView(TextView(this).apply {
                      text = "स्क्रीन पेन"
                      textSize = 28f
                      setTextColor(Color.parseColor("#1B2A41"))
                  })
                  root.addView(TextView(this).apply {
                      text = "YouTube या किसी भी ऐप के ऊपर पेन से लिखें।"
                      textSize = 16f
                      setPadding(0, dp(8), 0, dp(20))
                  })

                  status = TextView(this).apply {
                      textSize = 15f
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#EEF5FF"))
                          cornerRadius = dp(8).toFloat()
                      }
                  }
                  root.addView(status)

                  root.addView(button("1. ओवरले की अनुमति दें") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  })

                  root.addView(button("2. पेन शुरू करें") { startPen() })

                  root.addView(button("पेन बंद करें") {
                      startService(
                          Intent(this, OverlayService::class.java).setAction(OverlayService.ACTION_STOP)
                      )
                  })

                  root.addView(TextView(this).apply {
                      text = "कैसे चलाएँ:\n" +
                              "• पेन शुरू करने पर स्क्रीन पर छोटा टूलबार आएगा।\n" +
                              "• ≡ को खींचकर टूलबार कहीं भी रखें। उसे छूने से औज़ार छिपते और दिखते हैं।\n" +
                              "• ✏️ चालू हो तो स्क्रीन पर लिख सकते हैं।\n" +
                              "• 👆 दिखे तो आपका छूना नीचे वाले ऐप (जैसे YouTube) को जाता है, और लिखा हुआ दिखता रहता है।\n" +
                              "• ● से रंग, S/M/L से मोटाई, 🧽 से रबर, ↩ से पीछे, 🗑️ से सब साफ़, ✕ से बंद।"
                      textSize = 15f
                      setLineSpacing(0f, 1.3f)
                      setPadding(0, dp(20), 0, 0)
                  })

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              private fun button(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  textSize = 17f
                  isAllCaps = false
                  gravity = Gravity.CENTER
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = dp(12) }
              }

              private fun startPen() {
                  if (!Settings.canDrawOverlays(this)) {
                      status.text = "पहले बटन 1 से ओवरले की अनुमति दें।"
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  startForegroundService(Intent(this, OverlayService::class.java))
                  moveTaskToBack(true) // ऐप पीछे चला जाए, ताकि नीचे YouTube दिखे
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (Settings.canDrawOverlays(this))
                      "ओवरले की अनुमति मिल चुकी है। अब बटन 2 दबाएँ।"
                  else
                      "ओवरले की अनुमति अभी नहीं मिली। बटन 1 दबाकर इस ऐप के आगे स्विच चालू करें।"
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/DrawView.kt <<'EOF'
          package com.example.screenpen

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.view.MotionEvent
          import android.view.View

          /** पूरी स्क्रीन पर पारदर्शी परत, जिस पर पेन से लिखा जाता है। */
          class DrawView(context: Context) : View(context) {

              private class Stroke(val path: Path, val paint: Paint)

              private val strokes = ArrayList<Stroke>()
              private var current: Stroke? = null
              private var lastX = 0f
              private var lastY = 0f

              var penColor: Int = Color.RED
              var penWidth: Float = 8f
              var eraser: Boolean = false

              private fun newPaint(): Paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
                  if (eraser) {
                      xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
                      strokeWidth = penWidth * 3f
                  } else {
                      color = penColor
                      strokeWidth = penWidth
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  // रबर (CLEAR) सिर्फ अलग परत में सही चलता है
                  val layer = canvas.saveLayer(null, null)
                  for (s in strokes) canvas.drawPath(s.path, s.paint)
                  current?.let { canvas.drawPath(it.path, it.paint) }
                  canvas.restoreToCount(layer)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val x = e.x
                  val y = e.y
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          val p = Path().apply { moveTo(x, y); lineTo(x + 0.1f, y + 0.1f) }
                          current = Stroke(p, newPaint())
                          lastX = x; lastY = y
                      }
                      MotionEvent.ACTION_MOVE -> {
                          current?.let {
                              // बीच के बिंदुओं से लाइन चिकनी बनती है
                              for (i in 0 until e.historySize) {
                                  val hx = e.getHistoricalX(i)
                                  val hy = e.getHistoricalY(i)
                                  it.path.quadTo(lastX, lastY, (hx + lastX) / 2, (hy + lastY) / 2)
                                  lastX = hx; lastY = hy
                              }
                              it.path.quadTo(lastX, lastY, (x + lastX) / 2, (y + lastY) / 2)
                              lastX = x; lastY = y
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          current?.let { strokes.add(it) }
                          current = null
                      }
                  }
                  invalidate()
                  return true
              }

              fun undo() {
                  if (strokes.isNotEmpty()) {
                      strokes.removeAt(strokes.size - 1)
                      invalidate()
                  }
              }

              fun clearAll() {
                  strokes.clear()
                  current = null
                  invalidate()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/screenpen
          cat > app/src/main/java/com/example/screenpen/OverlayService.kt <<'EOF'
          package com.example.screenpen

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class OverlayService : Service() {

              companion object {
                  const val ACTION_STOP = "com.example.screenpen.STOP"
                  private const val CHANNEL_ID = "screen_pen"
                  private const val NOTIF_ID = 1
                  @Volatile var running = false
              }

              private lateinit var wm: WindowManager
              private var draw: DrawView? = null
              private var bar: LinearLayout? = null
              private lateinit var drawParams: WindowManager.LayoutParams
              private lateinit var barParams: WindowManager.LayoutParams
              private lateinit var tools: LinearLayout
              private lateinit var penBtn: TextView
              private lateinit var colorBtn: TextView
              private lateinit var sizeBtn: TextView
              private lateinit var eraserBtn: TextView

              private val colors = intArrayOf(
                  Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.WHITE, Color.BLACK, Color.BLUE
              )
              private val widths = floatArrayOf(4f, 8f, 16f)
              private val widthLabels = arrayOf("S", "M", "L")
              private var colorIdx = 0
              private var widthIdx = 1
              private var drawMode = true

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!running) {
                      startAsForeground()
                      createOverlay()
                      running = true
                  }
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "स्क्रीन पेन", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = PendingIntent.getService(
                      this, 0,
                      Intent(this, OverlayService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("स्क्रीन पेन चालू है")
                      .setContentText("बंद करने के लिए नीचे दबाएँ")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .setOngoing(true)
                      .addAction(
                          Notification.Action.Builder(
                              Icon.createWithResource(this, android.R.drawable.ic_delete),
                              "बंद करें", stopIntent
                          ).build()
                      )
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun createOverlay() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  // 1) पूरी स्क्रीन की ड्रॉइंग परत
                  val dv = DrawView(this)
                  draw = dv
                  drawParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(dv, drawParams)

                  // 2) तैरता हुआ टूलबार
                  val b = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), dp(2), dp(4), dp(2))
                      background = GradientDrawable().apply {
                          setColor(0xEE222B3A.toInt())
                          cornerRadius = dp(26).toFloat()
                      }
                  }
                  bar = b

                  val handle = label("≡", Color.WHITE)
                  setupHandle(handle)
                  b.addView(handle)

                  tools = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  b.addView(tools)

                  penBtn = label("✏️", Color.WHITE).also {
                      it.setOnClickListener { setDrawMode(!drawMode) }
                      tools.addView(it)
                  }
                  colorBtn = label("●", colors[colorIdx]).also {
                      it.setOnClickListener {
                          colorIdx = (colorIdx + 1) % colors.size
                          setEraser(false)
                          applyPen()
                      }
                      tools.addView(it)
                  }
                  sizeBtn = label(widthLabels[widthIdx], Color.WHITE).also {
                      it.setOnClickListener {
                          widthIdx = (widthIdx + 1) % widths.size
                          applyPen()
                      }
                      tools.addView(it)
                  }
                  eraserBtn = label("🧽", Color.WHITE).also {
                      it.setOnClickListener { setEraser(!(draw?.eraser ?: false)); setDrawMode(true) }
                      tools.addView(it)
                  }
                  tools.addView(label("↩", Color.WHITE).also { it.setOnClickListener { draw?.undo() } })
                  tools.addView(label("🗑️", Color.WHITE).also { it.setOnClickListener { draw?.clearAll() } })
                  tools.addView(label("✕", 0xFFFF6B6B.toInt()).also { it.setOnClickListener { stopSelf() } })

                  barParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(8)
                      y = dp(120)
                  }
                  wm.addView(b, barParams)

                  applyPen()
                  setEraser(false)
                  setDrawMode(true)
              }

              private fun label(text: String, color: Int) = TextView(this).apply {
                  this.text = text
                  textSize = 20f
                  setTextColor(color)
                  gravity = Gravity.CENTER
                  minWidth = dp(44)
                  minHeight = dp(44)
              }

              /** हैंडल: खींचें तो टूलबार हिलेगा, सिर्फ छूएँ तो औज़ार छिपेंगे/दिखेंगे। */
              private fun setupHandle(handle: View) {
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var downX = 0f; var downY = 0f
                  var startX = 0; var startY = 0
                  var moved = false
                  handle.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY
                              startX = barParams.x; startY = barParams.y
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (abs(dx) > slop || abs(dy) > slop) moved = true
                              if (moved) {
                                  barParams.x = startX + dx.toInt()
                                  barParams.y = startY + dy.toInt()
                                  wm.updateViewLayout(bar, barParams)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  tools.visibility =
                                      if (tools.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                              }
                          }
                      }
                      true
                  }
              }

              private fun applyPen() {
                  draw?.penColor = colors[colorIdx]
                  draw?.penWidth = widths[widthIdx]
                  colorBtn.setTextColor(colors[colorIdx])
                  sizeBtn.text = widthLabels[widthIdx]
              }

              private fun setEraser(on: Boolean) {
                  draw?.eraser = on
                  eraserBtn.alpha = if (on) 1f else 0.5f
              }

              /** चालू: स्क्रीन पर लिख सकते हैं। बंद: छूना नीचे वाले ऐप तक जाता है, लिखा हुआ दिखता रहता है। */
              private fun setDrawMode(on: Boolean) {
                  drawMode = on
                  drawParams.flags = if (on) {
                      drawParams.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  } else {
                      drawParams.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  draw?.let { wm.updateViewLayout(it, drawParams) }
                  penBtn.alpha = if (on) 1f else 0.5f
                  penBtn.text = if (on) "✏️" else "👆"
              }

              override fun onDestroy() {
                  try { draw?.let { wm.removeView(it) } } catch (_: Exception) {}
                  try { bar?.let { wm.removeView(it) } } catch (_: Exception) {}
                  draw = null; bar = null
                  running = false
                  super.onDestroy()
              }
          }
          EOF
      - name: Make signing key
        run: keytool -genkeypair -keystore ScreenPen/rel.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=ScreenPen"
      - name: Build release APK
        working-directory: ScreenPen
        run: gradle assembleRelease --no-daemon
      - name: Build debug APK
        continue-on-error: true
        working-directory: ScreenPen
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScreenPen-APK
          if-no-files-found: warn
          path: |
            ScreenPen/app/build/outputs/apk/release/app-release.apk
            ScreenPen/app/build/outputs/apk/debug/app-debug.apk
